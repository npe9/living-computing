<H3><A NAME=SECTION03032300000000000000> 大容量知識情報の効率的な並列管理技術</A></H3>
<P>
第五世代技術は、従来の技術では効率的に扱えなかった非定型的な大量データ
を効率的に管理する並列分散データベース技術を確立し、実用的な問題への計
算機による知識情報処理の適用に不可欠となる、自由に表現した大量の情報の
効率的アクセスへの道を開いた。
