<H3><A NAME=SECTION03032400000000000000> 高い自由度で表現した知識の並列処理基礎技術</A></H3>
<P>
第五世代技術は、従来の技術では困難だったさまざまな形式で自由に表現した
データを効率的に並列処理して利用するための基礎技術を確立し、大規模な知
識情報の効率的利用の基礎を作った。
