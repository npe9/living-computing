<H3><A NAME=SECTION03021200000000000000> 並列記号処理言語設計・実装技術</A></H3>
<P>
並列記号処理ソフトウェアの構築を難しくしている要因を同定し、それを取り
除くために必要なプログラム言語機能を備えた、簡潔で高機能なプログラム言
語KL1を設計した。また、KL1の効率的実装に必要な諸技術を確立し、実用的な
高性能の並列記号処理システムを設計・実装、ソフトウェア研究開発の共通ツー
ルとして提供した。
