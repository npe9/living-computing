<H3><A NAME=SECTION03043100000000000000> 第五世代技術を具体的な問題に適用し、その総合的な優位性
を実践的に検証</A></H3>
<P>
プロジェクトで開発した並列記号処理技術、知識情報処理技術を実用レベルの
規模と複雑さを持つ具体的な問題に適用し、これらの技術を総合的に活用する
ことによって、これらの技術が提供する機能の適切性、実現手法の効率性を検
証した。また、従来技術でも同様の機能を実現している分野については、従来
の手法での実現方法と比較し、第五世代技術の優位性を実践的に検証した。
