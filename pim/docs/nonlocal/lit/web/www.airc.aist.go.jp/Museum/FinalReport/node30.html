<H3><A NAME=SECTION03032200000000000000> 高レベルで自由度の高い知識表現技術</A></H3>
<P>

<P>
第五世代技術は、従来技術では不可能だった高レベルで自由な知識表現の基礎
技術を確立、実際に各種の問題についての適用を通じて、人間の持つ知識のさ
まざまな性質を、計算機処理という側面から明らかにした。一方、高レベルの
表現は、計算機による知識獲得などのさらに高いレベルの処理も著しく容易に
した。
