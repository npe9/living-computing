<H3><A NAME=SECTION03022100000000000000> 並列処理を前提としたポリシーの一貫した記号処理システム</A></H3>
<P>
逐次処理技術の漸時改良による従来技術は複雑で統一性に欠け、並列ソフトウェ
アの開発は困難を極めた。これに対し第五世代技術は、並列処理を前提とした
並列論理型パラダイムに基づく一貫した技術体系であり、大規模並列ソフトウェ
アの開発を飛躍的に容易にした。
