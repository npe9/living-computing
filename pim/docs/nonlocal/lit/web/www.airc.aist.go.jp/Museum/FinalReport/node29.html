<H3><A NAME=SECTION03032100000000000000> 高レベルで表現した知識を効率的に処理する基礎技術</A></H3>
<P>

<P>
第五世代技術は、従来の技術では不可能だった高レベル表現の情報を効率的に
並列処理する基礎技術を確立し、大規模で実際的な問題に対する知識情報処理
への道を開いた。
