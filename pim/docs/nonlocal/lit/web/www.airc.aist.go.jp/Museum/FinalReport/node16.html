<H3><A NAME=SECTION03022200000000000000> 並列記号処理言語設計・実装技術</A></H3>
<P>

<P>
逐次処理言語に必要に応じて並列機能を追加した従来の並列プログラム言語に
比べ、並列処理を前提とした設計による並列論理型言語KL1は、大幅な機能向
上と簡潔な仕様を同時に実現した。また、知識情報処理に不可欠な非定型的処
理や、負荷分散の容易な細粒度並列処理の効率を大きく向上させる実装技術を
開発し、ソフトウェアの負担を大幅に軽減させた。
