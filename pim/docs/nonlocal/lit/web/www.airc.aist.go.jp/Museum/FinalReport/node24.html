<H3><A NAME=SECTION03031100000000000000> 並列論理型パラダイムに基づく知識情報処理基礎技術</A></H3>
<P>

<P>
知識情報の表現・管理・利用の諸技術を、並列論理型パラダイムに基づいて再
構成し、高いレベルで自由に表現した知識を効率的に並列処理する、大規模知
識情報処理に必須な基礎技術を確立した。
