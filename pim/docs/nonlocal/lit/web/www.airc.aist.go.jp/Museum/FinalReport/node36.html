<H2><A NAME=SECTION03041000000000000000> 実験的応用システム構築の目的</A></H2>
<P>
第五世代技術のような新たな基礎的技術の体系の有効性を示すには、技術体系
自身についての検討評価のみでは不十分で、実際にその技術体系を用いて応用
システムを構築することを通して検証しなければならない。実験的応用システ
ムの構築の本来の目的は、応用システムの構築自体ではなく、それを通じて第
五世代技術体系を評価することにあった。
