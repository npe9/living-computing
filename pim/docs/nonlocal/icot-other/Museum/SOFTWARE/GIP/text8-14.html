アライメントを開始すると、同じ縦の列は同じか性質の似ているアミノ酸で一列に揃うようにギャップが挿入されていきます。画面では「<B>-</B>」(ハイフン)で表示しています。<BR>
画面右の70列目付近では縦に「<B>E</B>」が揃っているのが分かります。<BR>
また、画面上部には修正後のアライメントに対する評価値(スコア)が表示されています。初期のスコアから改善されていくのがわかります。<BR>
