この最終結果では1〜10列目や34列目付近ではスコアの高いカラムが連続しています。この部分は生物学的に重要な部分であることが予測されます。<BR>
<BR>
このように、アライメントを行なった結果からモチーフ領域を予測したり生物間の近遠性を調べることができます。
