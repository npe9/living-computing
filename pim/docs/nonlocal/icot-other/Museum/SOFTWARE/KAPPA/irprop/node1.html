<H1><A NAME=SECTION00010000000000000000> 名簿管理プログラムのコンパイル</A></H1>
<P>
Kappaのコンパイルを行なうと、名簿管理システムの一部（サーバ側）もコン
パイルされる。この結果、実行ファイルkappaが生成される。
<P>
クライアント側のコンパイルは、/Kappa/src/irpr/irpr_clientに位置付けて、
makeコマンドを発行する。この結果、実行ファイルirpr_clientが生成される。
<P>
実行ファイルは、実行ファイルのパスの通っている適当なディレクトリにコピー
する。
<P>
