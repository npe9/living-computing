<H3><A NAME=SECTION00031100000000000000> システム構成</A></H3>
<P>
Kappaは分散データベースの構成をとることができる。
すなわち、各クラスタにローカルDBMS(LDBMS)を配置し、それらの全体で
一つのデータベースを管理する。
<P>
複数のLDBMSが関係する問い合わせを処理するために、2相コミットプロトコル
に基づく分散トランザクションの機能を持っている。
<P>
