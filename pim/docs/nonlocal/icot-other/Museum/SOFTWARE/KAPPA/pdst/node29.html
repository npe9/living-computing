<H3><A NAME=SECTION00036700000000000000> その他</A></H3>
<P>
<DL ><DT>get_table_info(TableName,InfoList,^Status)
<DD>
	指定された種類のテーブル情報の値を返す。
 <DT>get_attribute_info(TableName,Attribute,InfoList,
	^Status)
<DD>
	Attributeに指定された属性の情報を返す。参照したい情報は
	InfoListで指定する。属性としてインデックスのみ属性も指定できる。
	ネスト・シーケンス、水平分割情報を参照する場合には、Attribute
	にテーブル全体を指定する。
<P>
