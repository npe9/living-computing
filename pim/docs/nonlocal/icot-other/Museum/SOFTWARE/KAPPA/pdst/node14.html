<H3><A NAME=SECTION00031200000000000000> テーブル</A></H3>
<P>
データベースを構成するテーブル（非正規関係）は、スキーマによりその構造
が決定される。
集合値は、繰り返し性質setによって特徴付けられ、値の重複がなく、値の順
序も意味を持たない。
