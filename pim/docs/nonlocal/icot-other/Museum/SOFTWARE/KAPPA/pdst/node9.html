<H2><A NAME=SECTION00023000000000000000> Kappaのモデル</A></H2>
<P>
Kappa では、<A HREF="node8.html#snr">2.2.2</A> 節で説明した非正規関係モデルを採用している。と
ころが「非正規関係」という同じ名前を使っていても、さまざまな意味論が使
われている。すなわち、同じ問合せでも、意味論の違いによって回答が異なっ
てくるのである。本節ではそれを明確にする。
<P>
