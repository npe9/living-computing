<H2><A NAME=SECTION00022000000000000000> 関係モデルと非正規関係モデル</A></H2>
<P>
関係DBMSの基になっているのが関係モデルであり、それを拡張したのが非正規
関係モデルである。Kappa は非正規関係モデルに基づいているが、まず(正規)
関係モデルから始めよう。
