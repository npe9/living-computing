次に、<b> Quixote </b> の２番目の特徴として、
<font color="#228822"> 包摂制約(subsumption) </font> を説明します。<p>

<b> Quixote </b> では、包摂制約を用いて、
<font color="#228822"> オブジェクト間の上下関係を定義できます。</font> <p>

包摂制約とは、いわゆる「である」を示す IS Aとか、あるいは、
「の一種」を示す A Kind Of のことです。<p>

例えば、「菱形は平行四辺形である」、「正方形は菱形の一種」は、
それぞれ OHP の黄色の四角に囲まれた部分のように記述できます。<p>
