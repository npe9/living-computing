オブジェクト指向プログラミング言語では、
データや知識を表現する時にオブジェクトを識別したり、
区別することは重要です。<p>

<b> Quixote </b> では、オブジェクト識別子の役割を持つ
<font color="#228822"> オブジェクト項 </font> を用意しています。<p>

オブジェクト項には、２種類あります。
一つは、<font color="#228822"> 基礎オブジェクト項 </font> と呼ばれ、
りんご、cider、四角形などのアトムです。
もう一つは <font color="#228822"> 複合オブジェクト項 </font> で、
OHP の最後にあるような構造を持ちます。<p>

この複合オブジェクト項は、「青リンゴ」を表しています。
<p>
