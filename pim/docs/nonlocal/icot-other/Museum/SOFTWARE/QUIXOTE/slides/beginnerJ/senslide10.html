<font color="#228822"> 属性は包摂制約として書き換えることができます。</font>
<p>

先ほど属性項を説明した時に、りんごの
「色は赤、バラ科の一種、産地は長野県と青森県」という属性は、
OHP のりんごの絵の右側にあるように、記述されることを説明しました。<p>

<b> Quixote </b> では、<font color="#228822"> ドット項 </font> という
「オブジェクト項、ピリオド、属性名」からなる項を使って、
属性を包摂制約に書き換えられます。例えば、先ほど挙げた例は
矢印の下のように書き換えられます。<p>

この変換によって、全ての属性項は包摂制約に書き換えられ、
<b> Quixote </b> は包摂制約に基づいた制約論理型言語と
考えられます。
<p>
