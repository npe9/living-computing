例えば、<blink> 「日本でサイダーは無税か？」 </blink>
と問いたくなったとします。それは、
<b> Quixote </b> では、最初の四角の中に書かれているように表されます。<p>

先ほど説明した例題では、日本に関する知識(ルール)は、
<blink> 「日本ではサイダーは炭酸水から作られる。」と
	「日本ではノンアルコール飲料は無税である。」</blink> 
の２つでした。
それらは <b> Quixote </b> では２番目の四角の中のように表されます。<p>

これらに対する、問合せの <b> Quixote </b> の答えは、
最後の四角で囲まれたものです。
これは
<blink> 「日本ではサイダーがノンアルコールなら yes です。」 </blink>
を表しています。
IF の部分が仮定で、データベースにはない知識を示しています。
<b> Quixote </b> では、知識の「部分性」という特徴に対応していて、
データベースは完全ではないという立場に立っているので、問い合わせでも
このように仮定(データベースに欠けている情報)を返します。<p>

これに対して、知識処理のきっかけとなった prolog という言語は
仮定を返さず、<b> Quixote </b> の方が拡張されています。<p>
