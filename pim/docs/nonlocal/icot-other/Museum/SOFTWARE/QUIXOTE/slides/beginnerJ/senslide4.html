<b> Quixote </b> の具体的特徴としては、主に５つ挙げられます。
それは、<font color="#228822"> (1) オブジェクト識別性、(2) 包摂制約、
(3) 属性継承、(4) モジュール階層、(5) 仮説付き問合せと仮定付き解 </font>
です。<p>

この特徴が、どのようなものに役に立つかと申しますと、
(1) と (3) は <font color="#228822"> 効率的な表現 </font> に、
(2) は物事の <font color="#228822"> 関係付け </font> に、
(3) と (4) は、プログラムなどの <font color="#228822"> 分類 </font> に
役立ちます。
また、(5) によって、<b> Quixote </b> は演繹推論ばかりではなく、
<font color="#228822"> 仮説推論 </font> もできることが分かります。<p>

これらを具体的に説明する前に、今回の例題を説明しましょう。
<p>
