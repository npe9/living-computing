<b> Quixote </b> は、<b> ICOT </b> とその後継プロジェクトの
知識情報処理の中核言語として設計されました。
主な <font color="#228822"> 特徴 </font> として、次の３つが挙げられます。<p>

まず、<b> Quixote </b> は、オブジェクト指向の性質、ルール、演繹推論を
持つ <font color="#228822"> 演繹オブジェクト指向データベース言語 </font>
の一つです。<p>

次に、<b> Quixote </b> は、包摂制約に基づいた
<font color="#228822"> 制約論理型言語 </font> の一つでもあります。<p>

３つ目は、部分情報、仮説推論を扱える
<font color="#228822"> 知識表現言語 </font> とも言えます。<p>

次に、<b> Quixote </b> の誕生までを簡単に説明しましょう。
