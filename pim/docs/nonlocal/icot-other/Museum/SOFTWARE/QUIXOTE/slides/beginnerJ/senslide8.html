<body bgcolor="#FFFACD" text="#0000FF" link="#FF0000" vlink="#228822" alink="#BEBEBE">
例えば、リンゴは、
「色は赤、バラ科の一種、産地は長野県と青森県」などという
性質を持っているように、一般にオブジェクトは性質(属性とも言いますが)を
持っています。<p>

<b> Quixote </b> では、オブジェクトとその性質を
<font color="#228822"> 属性項 </font> と呼んでいる項で記述できます。<p>

矢印の下に書かれたものが、リンゴと先ほど挙げた性質を
記述した属性項です。
この例から分かるように、性質を記述するのに
<b> Quixote </b> では集合も使えます。
<p>
