今回の例題は、皆さんが小学校の時に習った、
<font color="#228822"> 四角形 </font> についてです。<p>

四角形のうち、向かい合う辺が平行なものは、平行四辺形です。
平行四辺形のうち、４辺が等しいと菱形で、
４つの角が９０度だと長方形です。
更に、菱形でもあり、長方形でもあるものが正方形です。<p>

こんなことを小学生の時に習ったことを思い出されましたか？
