次に、<b> Quixote </b> の３番目の特徴として、
<a href=""> 属性継承 </a> を説明します。<p>

<b> Quixote </b> では、先ほど説明しました包摂関係に沿って属性の継承が
起きます。<p>

例えば、「フジはリンゴである」場合は、「色は赤」
という属性は、フジに自動的に継承されます。<p>

しかし、OHP の緑のりんごのところに書かれている複合オブジェクト項の場合、
これは「青りんご」を表していて、継承は起きません。
なぜなら、青りんごの色が緑でなくなったら、青りんごではなくなって
しまうからです。
