私達は、2つの <b> Quixote </b> システムを開発しました。

一つはサーバ、クライアント形式の
<blink> <b> big-Quixote </b> </blink> と
呼ばれているシステムで、<b> KLIC </b> 上で動き、
<b> Quixote </b> の全ての機能を実現する目的で作られました。
そのため大きなシステムとなりました。<p>

もう一つのシステムは、
<blink> <b> micro-Quixote </b> </blink> と呼ばれ、
<b> Quixote </b> の主要機能に限り、全てを <b> C </b> で実装し、
コンパクトなシステムとしました。<p>

<b> big-Quixote </b>、<b> micro-Quixote </b> それぞれ
一長一短あることが分かってきたので、2 つのシステムを
作った経験を生かし、ユーザの意見を取り入れながら、
今後より洗練された第３の<b> ??- Quixote </b> を作りたいと
考えています。<p>
