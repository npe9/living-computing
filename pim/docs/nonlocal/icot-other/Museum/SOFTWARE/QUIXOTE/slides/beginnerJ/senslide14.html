<b> Quixote </b> では、
<font color="#228822"> 「角２が８０度なら、四角形ａの形は？」 </font> という
質問を出すこともできます。<p>

「角２が８０度なら」は、仮説です。つまり、<b> Quixote </b> では
このような仮説付き問い合わせを処理できます。<p>

"?-" で始まるものが <b> Quixote </b> で記述された問合せです。
そのうち、四角で囲まれた部分が仮説を表しています。<p>

この仕組みは、データベースを作った後に「角２が８０度」が分かった時、
四角形ａの形を知りたい場合にも使えます。<p>
