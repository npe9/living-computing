私達は、2つの <b> Quixote </b> システムを開発しました。

一つはサーバ、クライアント形式の
<a href=""> <b> big-Quixote </b> </a> と
呼ばれているシステムで、<b> KLIC </b> 上で動き、
<b> Quixote </b> の全ての機能を実現する目的で作られました。
そのため大きなシステムとなりました。<p>

もう一つのシステムは、
<a href=""> <b> micro-Quixote </b> </a> と呼ばれ、
<b> Quixote </b> の主要機能に限り、全てを <b> C </b> で実装し、
コンパクトなシステムとしました。<p>

この２つのシステムは、ここに書かれているアドレスから
持っていくことができます。使ってみて下さい。<p>
