私達は、2つの <b> Quixote </b> システムを開発しました。

一つはサーバ、クライアント形式の
<font color="#228822"> <b> big-Quixote </b> </font> と

<b> Quixote </b> の主要機能に限り、全てを <b> C </b> で実装し、
コンパクトなシステムとしました。<p>
