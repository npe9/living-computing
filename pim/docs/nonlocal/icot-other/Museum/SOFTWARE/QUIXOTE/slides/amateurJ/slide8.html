<b> Quixote </b> では
<blink> 「日本でサイダーがノンアルコールなら、
サイダーは無税か？」</blink> という質問も出すことができます。<p>

「日本でサイダーがノンアルコールなら」は、仮説です。
このような仮説付き問い合わせは、prolog では処理できませんが、
<b> Quixote </b> では処理できます。<p>

"?-" で始まるものが <b> Quixote </b> で記述された問合せです。
そのうち、四角で囲まれた部分が仮説を表しています。<p>

答えは、先ほどの問合せから分かるように、
<blink> yes </blink> が返ります。<p>

<b> Quixote </b> では、このような仮説付き問合せを出すことによって、
データベースを用いて試行錯誤を行なうことができます。
知識は完全ではないので知識を扱うシステムにとって、この仕組みは
とても有効なものと考えられます。<p>
