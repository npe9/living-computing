<title> Smyth Order </title>
<h1> Smyth 順序について</h1>
<hr>

<h3> [Q] Smyth 順序の meet と join を教えて下さい。</h3>
<p>

<hr>
<pre> [A] Smyth 順序における、集合 X と Y の meet は、
     XとYの集合の union です。

     集合 X と Y の join は、
     XとYの要素の全組合せのjoinからなる集合 です。

     Quixote が用いている Hoare 順序の meet と join については、
     「Quixote の言語マニュアル 2.2.4 完備束、ミート、ジョイン」
     を御覧下さい。
</pre>
