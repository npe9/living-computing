<title> Answer to Query 4 of CISG </title>
<h1>「ウィーン売買条約第ＩＩ部」の問合せ４に対する答え</h1>
<hr>

<h3> 「申込に対する意思表示は承諾となっているか？」の答を示します。</h3>

例えば、
<pre>
	「６番目の申込に対する意思表示は承諾となっているか？」
</pre>
という問合せを実行したとします。すると、例えば、<b> Quixote </b>からは
以下のような答が返されます。

	<pre>	IF fact:回答[順番=7].行為 =< 同意する旨を示す行為
	THEN YES
	</pre>

です。これは
	<pre>	もし、７番目の回答(「６番目の申込に対する意思表示」のこと)の
	      行為が、同意する旨を示すなら、
	YES です。</pre>
を表しています。
