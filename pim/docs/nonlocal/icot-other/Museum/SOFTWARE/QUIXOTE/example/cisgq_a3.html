<title> Answer to Query 3 of CISG </title>
<h2>「ウィーン売買条約第ＩＩ部」の問合せと答えの例３</h2>
<hr>

<h3> 「１番目の申込に対する意思表示は反対申込となっているか？」の問いは、</h3>
	<pre>	?- def:申込[順番=2].</pre>
と記述されます。<p>

<hr>
<h3> 次に答を示します。</h3>

<b> Quixote </b>からは、例えば以下のような答が返されます。

	<pre>	IF fact:回答[順番=2].変更を含んでいる==yes
	THEN YES
	</pre>

です。これは
	<pre>	もし、２番目の回答(「１番目の申込に対する意思表示」のこと)が
	      変更を含んでいるなら、
	YES です。</pre>
を表しています。
