<title> Article 21 and the program </title>
<h1> 第21条 とそのプログラム</h1>
<hr>

<dl>
<dt> 第21条
 <dd>
 <dl>
 <dt> (1)
   <dd> 遅延した承諾といえども、申込者が有効な承諾として扱う旨を
	遅滞なく被申込者に口頭で通告し又はその旨の通知を発した
	場合には、承諾としての効力を有する。
 <dt> (2)
   <dd> 遅延した承諾を含む書簡その他の書面が、通常の通信状況で
	あれば適切な時期に申込者に到達したであろう状況の下で
	発送されたことを示しているときは、申込者が遅滞なく被申込者に
	対して申込が既に失効していたものとして扱う旨を口頭で
	通告するか、又はその旨の通知を発しない限り、遅延した承諾
	であっても承諾としての効力を有する。
 </dl>
