<title> Query 6 of CISG </title>
<h1>「ウィーン売買条約第ＩＩ部」の問合せ６</h1>
<hr>

<h3> 「契約は成立したか？」の記述を
説明します。</h3><p>

ここで説明している記述では、申込に番号を振っているので、
例えば、
	<pre>	「９番目の申込に対する承諾によって契約は成立したか？」</pre>
という問合せは、
	<pre>	?- def:契約[順番=10]. </pre>
と記述されます。<p>

もし、申込の番号に関係なく、
	<pre>	「契約が成立したかどうかのみ知りたい」</pre>
場合は
	<pre>	?- def:契約[順番=K]. </pre>
とすれば、契約が成立したかどうかと、成立した場合、その承諾が
何番目の申込に対するものか教えてくれます。<p>
