<title> Answer to Query 9 of CISG </title>
<h1>「ウィーン売買条約第ＩＩ部」の問合せ９に対する答え</h1>
<hr>

<h3> 「承諾を撤回できるか？」の答を示します。</h3>

例えば、
<pre>
	「承諾を撤回できるか？」
</pre>
という問合せを実行したとします。すると、例えば、<b> Quixote </b>からは
以下のような答が返されます。

	<pre>	IF 
	THEN YES
	IF 
	THEN YES
	IF 
	THEN YES
	</pre>

です。最初の答えは
	<pre>	もし、
	YES です。</pre>
を表しています。他も同様です。
