<title> Query 2 of CISG </title>
<h1>「ウィーン売買条約第ＩＩ部」の問合せ２</h1>
<hr>

<h3> 「申込に対する意思表示は反対申込となっているか？」の記述を
説明します。</h3><p>

ここで説明している記述では、最初の申入れが申込となると、
０番目の申込が定義されたとし、Ｋ番目の申込に対する意思表示が
反対申込となると、それを Ｋ＋１番目の申込が定義されたとしています。<p>

ですから、例えば、
<pre>
	「１番目の申込に対する意思表示は反対申込となっているか？」
</pre>
という問合せは、
	<pre>	?- def:申込[順番=2].</pre>
と記述されます。<p>
