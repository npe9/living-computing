<title> Answer to Query 5 of CISG </title>
<h1>「ウィーン売買条約第ＩＩ部」の問合せと答えの例５</h1>
<hr>

<h3> 「３番目の申込は撤回できるか？」の問いは、</h3>
	<pre>	?- capable:申込撤回[順番=3]. </pre>
と記述されます。<p>

<h3> 次に答を示します。</h3>

<b> Quixote </b>からは例えば以下のような答が返されます。

	<pre>	IF fact:回答[順番=4].種類=削除[対象=回答[順番=3]]
	   def:到達[順番=4].到達日時 =< def:到達[順番=3].到達日時
	THEN YES
	</pre>

です。これは
	<pre>	もし、４番目の回答が３番目の回答を削除するもので、
	      到達日時が３番目と同じかそれよりも早いなら、
	YES です。</pre>
を表しています。
