<title> Article 22 and the program </title>
<h1> 第22条 とそのプログラム</h1>
<hr>

<dl>
<dt> 第22条
 <dd> 承諾は、その撤回通知が、承諾の効力が生じたであろう時よりも
      前又はそれと同時に申込者に到達すれば、撤回できる。
<dt> プログラム
 <dd><pre>capable::承諾撤回[順番=N]/[承諾者=A,申込者=B] <=

  def:承諾[順番=N]/[承諾者=A,申込者=B];
  def:到達[順番=N]/[到達日時=S0];
  def:到達[順番=M]/[到達日時=S1]
  ||{S1 <a href = "cisgpronotice2.html">=<</a> S0};; </pre>
</dl>
