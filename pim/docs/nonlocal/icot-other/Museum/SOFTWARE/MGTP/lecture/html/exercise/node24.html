<H1><A NAME=SECTION00360000000000000000> 【演習問題６：``自明でない問題'' (TPTP/MSC006-1)】</A></H1>
<P>

<P>

<P>
<PRE>dom(A),dom(B)--&gt;p(A,B);q(A,B).

p(A,B),p(B,C)--&gt;p(A,C).
q(A,B),q(B,C)--&gt;q(A,C).
q(A,B)--&gt;q(B,A).

p(a,b)--&gt;false.
q(c,d)--&gt;false.

true--&gt;dom(a),dom(b),dom(c),dom(d).
</PRE>
