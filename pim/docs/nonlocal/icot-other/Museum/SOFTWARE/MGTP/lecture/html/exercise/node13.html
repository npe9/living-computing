<H1><A NAME=SECTION00260000000000000000> 【演習問題６：``自明でない問題'' (TPTP/MSC006-1)】</A></H1>
<P>

<P>
二つの関係pとqがある。
pは推移的である。
qは推移的である上に対称的でもある。
あらゆるものはpかqで関係づけられるとする。
このとき、すべてがpで関係づけられているか、
すべてがqで関係づけられているかのいずれか(あるいは両方)である。
<P>
