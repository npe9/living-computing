<H1><A NAME=SECTION00230000000000000000> 【演習問題３：パズル``猿とバナナ'' (TPTP/PLA003-1)】</A></H1>
<P>

<P>

<P>
今、部屋のある場所に猿が一匹いる。
また、部屋のある場所では天井からバナナが吊されている。
さらにまたある場所に、踏台が置いてある。
<P>
猿はいくつかの行動が可能であるとする。
たとえば、
「手ぶらの猿は、床上を部屋のどこにでも移動できる。」
とか、
「踏台の所にいる猿は、踏台に乗れば天井に手が届く。」
とかいったことである。
<P>
さて、この猿がバナナにありつけるためにはほかにどのような
行動規則を用意すればよいか？
<P>
