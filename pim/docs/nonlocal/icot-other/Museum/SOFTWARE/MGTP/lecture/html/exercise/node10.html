<H2><A NAME=SECTION00241000000000000000> ヒント</A></H2>
<P>
まず、この問題における基本的な述語として、
<UL><LI> <code>SPM_quot</code>contain(A,B)&quot;: 箱Aの中身は果物Bである
<LI> <code>SPM_quot</code>label(A,B)&quot;: 箱AにはラベルBが貼ってある
</UL>
を考えよう。
オブジェクト(個体定数)としては、箱a,b,c、果物リンゴ、オレンジ、バナナ
の計６つである。
<P>
※ 箱a,b,cがそれぞれほかの箱と違うこと、
果物リンゴ、オレンジ、バナナがそれぞれほかの果物と違うこと、
は我々にとっては自明で暗黙の知識と言えるが、
定理証明の場合にはそれらもすべて明示的に表現しなければならない。
