<H1><A NAME=SECTION00250000000000000000> 【演習問題５：パズル``正直者と嘘つき'' (TPTP/PUZ025-1)】</A></H1>
<P>

<P>

<P>
ある島では、住人が正直者か嘘付きのいずれかであるという。
正直者は決して嘘はつかず、嘘付きは決して本当のことを言わない。
今、この島にa,b,cの３人が集まっている。
aが、「bとcは同じタイプだ」と発言した。
すると誰かが、「aとbは同じタイプか？」と質問した。
cは何と答えたであろうか？
