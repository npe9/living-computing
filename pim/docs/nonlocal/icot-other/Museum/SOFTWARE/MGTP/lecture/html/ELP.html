<h1>拡張論理型言語</h1>

法的推論における知識ベースの記述は、拡張論理型言語として記述される。
法律知識、判例等の知識は以下のような
ルールID、ヘッド、ボディからなるルール形式として表現される。<P>

[例] <BR>
r1(X)::fly(agt=X) \Leftarrow bird(agt=X),not baby(agt=X).<BR>
r2(X)::-fly(agt=X)  \Leftarrow  penguin(agt=X).<BR>
f1::bird(agt=pingu).<BR>
f2::penguin(agt=pingu).<BR>
f3::baby(agt=pingu).<P>
