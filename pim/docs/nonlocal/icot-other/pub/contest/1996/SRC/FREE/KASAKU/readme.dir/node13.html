<H2><A NAME=SECTION00042000000000000000>A.2 今回用いたパラメータ</A></H2>
<P>
今回は、Q-learning のパラメータ値を以下のように定めた。
Q-function の初期値および報酬を大きくとっているのは、
浮動小数点計算を避けることで処理を高速にするためである。
<P>
<DL ><DT>割引率
<DD>
  <IMG  ALIGN=MIDDLE ALT="gamma" SRC="img16.gif"> = 95% (0.95)
<DT>学習率
<DD>
  <IMG  ALIGN=MIDDLE ALT="alpha" SRC="img17.gif">
  （但し <b>Step</b> は、初手からの手数）
<DT>Q-function 初期値
<DD>
  <IMG  ALIGN=MIDDLE ALT="Q(i_0, u_0)" SRC="img18.gif"> = 10000
<DT>報酬値
<DD>
  10000, 0, -10000
<P>
