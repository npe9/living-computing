<H2><A NAME="SECTION00034000000000000000">フラッシュ選択</A></H2>
<P>
   前段の余りカードからフラッシュを作る。前段がうまくいっていれば残り全
   てのカードがフラッシュに使えることになる。ここでは、総出現数の多いカー
   ドを優先して配置することにした。4 of a kind や 3 of a kind を阻害しに
   くい選び方を考えた結果である(残念ながら直観でしかない)。
<P>
