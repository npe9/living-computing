<H1><A NAME="SECTION00010000000000000000">目的</A></H1>
<P>
 配られた25枚のカードを 5x5 に配置する。この際、行、列、斜めの合計
 １２の手役の得点合計をできるだけ大きくするような配置を短時間で探す。
<P>
 また、KLICを使うのは始めてなので、KLICに慣れること、KLICの特徴を把握す
 ることも目標に据えた。
<P>
